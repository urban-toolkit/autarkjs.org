<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linked Views for Urban Analysis</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f172a;
      font-family: Inter, system-ui, sans-serif;
    }

    @keyframes autk-spin {
      to { transform: rotate(360deg); }
    }

    .example-root {
      position: relative;
      width: 100%;
      height: 100vh;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(14,165,233,0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(59,130,246,0.10), transparent 30%),
        #0f172a;
    }

    .map-panel,
    .plot-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .plot-panel {
      background: rgba(255,255,255,0.97);
      border-left: 1px solid rgba(15,23,42,0.08);
      overflow: auto;
    }

    #map-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #plotBody {
      width: 100%;
      height: 100%;
      padding: 24px 18px;
      box-sizing: border-box;
    }

    #loading-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.92);
      background: rgba(15,23,42,0.38);
      backdrop-filter: blur(4px);
      z-index: 20;
    }

    .autk-spinner {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.9);
      border-radius: 50%;
      animation: autk-spin 0.8s linear infinite;
    }

    @media (max-width: 960px) {
      .example-root {
        grid-template-columns: 1fr;
        grid-template-rows: 52vh 48vh;
      }

      .plot-panel {
        border-left: 0;
        border-top: 1px solid rgba(15,23,42,0.08);
      }
    }
  </style>
</head>
<body>
  <div class="example-root">
    <div id="loading-status">
      <div class="autk-spinner"></div>
      <span id="loading-text">Loading...</span>
    </div>

    <div class="map-panel">
      <canvas id="map-canvas"></canvas>
    </div>

    <div class="plot-panel">
      <div id="plotBody"></div>
    </div>
  </div>

  <script type="module" src="/examples/dist/ex5.js"></script>
</body>
</html>
