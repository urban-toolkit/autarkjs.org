<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linked Views with Map and Chart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b1220;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      width: 100%;
      height: 100vh;
      background: #0b1220;
    }

    .map-shell,
    .plot-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .map-shell {
      border-right: 1px solid rgba(148, 163, 184, 0.14);
      background: #0b1220;
    }

    .plot-shell {
      background: #f8fafc;
      overflow: auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #plotBody {
      width: 100%;
      height: 100%;
      padding: 16px;
      overflow: auto;
      background: #f8fafc;
    }

    #loading-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.56);
      backdrop-filter: blur(4px);
      z-index: 20;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 260px;
      max-width: 420px;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 14px 34px rgba(2, 6, 23, 0.3);
    }

    .autk-spinner {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-top-color: rgba(255, 255, 255, 0.92);
      animation: spin 0.85s linear infinite;
      flex-shrink: 0;
    }

    #loading-text {
      color: #e5e7eb;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 52vh 48vh;
      }

      .map-shell {
        border-right: none;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="map-shell">
      <div id="loading-status">
        <div class="status-card">
          <div class="autk-spinner"></div>
          <span id="loading-text">Loading linked views example...</span>
        </div>
      </div>

      <canvas></canvas>
    </div>

    <div class="plot-shell">
      <div id="plotBody"></div>
    </div>
  </div>

  <script type="module" src="/examples/dist/ex5.js"></script>
</body>
</html>
