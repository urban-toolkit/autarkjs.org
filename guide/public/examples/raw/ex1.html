<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boston Streets and EV Charging Stations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b1120;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      padding: 12px;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.08), transparent 26%),
        linear-gradient(180deg, #0b1120 0%, #0f172a 100%);
    }

    .panel {
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.28);
      backdrop-filter: blur(8px);
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.03),
        rgba(255, 255, 255, 0.01)
      );
    }

    .panel-head h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: #e5e7eb;
    }

    .panel-head p {
      margin: 6px 0 0;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #94a3b8;
    }

    .map-shell {
      position: relative;
      width: 100%;
      height: 860px;
      background: #0b1220;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.56);
      backdrop-filter: blur(4px);
      z-index: 20;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 260px;
      max-width: 420px;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 14px 34px rgba(2, 6, 23, 0.3);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-top-color: rgba(255, 255, 255, 0.92);
      animation: spin 0.85s linear infinite;
      flex-shrink: 0;
    }

    #loading-text {
      color: #e5e7eb;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 10px;
      }

      .map-shell {
        height: 640px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="panel">
      <div class="panel-head">
        <h1>Boston Streets and EV Charging Stations</h1>
        <p>
          Explore the Boston street network and electric vehicle charging stations using the map controls built into Autark.
        </p>
      </div>

      <div class="map-shell">
        <div id="loading-status">
          <div class="status-card">
            <div class="spinner"></div>
            <span id="loading-text">Loading Boston datasets...</span>
          </div>
        </div>

        <canvas></canvas>
      </div>
    </section>
  </div>

  <script type="module" src="/examples/dist/ex1.js"></script>
</body>
</html>
