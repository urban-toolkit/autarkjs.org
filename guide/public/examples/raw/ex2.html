<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Join in the Browser</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f172a;
      font-family: Inter, system-ui, sans-serif;
    }

    @keyframes autk-spin {
      to { transform: rotate(360deg); }
    }

    .example-root {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(14,165,233,0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(59,130,246,0.10), transparent 30%),
        #0f172a;
    }

    #map-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.92);
      background: rgba(15,23,42,0.38);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .autk-spinner {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.9);
      border-radius: 50%;
      animation: autk-spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
  <div class="example-root">
    <div id="loading-status">
      <div class="autk-spinner"></div>
      <span id="loading-text">Loading...</span>
    </div>
    <canvas id="map-canvas"></canvas>
  </div>

  <script type="module" src="/examples/dist/ex2.js"></script>
</body>
</html>
