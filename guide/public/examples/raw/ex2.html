<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map and Database Integration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f17;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .map-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Loading ──────────────────────────────────────────────────────────── */

    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(11, 15, 23, 0.56);
      backdrop-filter: blur(6px);
    }

    .loading-overlay.hidden {
      display: none;
    }

    .loading-overlay.error .loading-card {
      border-color: rgba(220, 38, 38, 0.28);
    }

    .loading-card {
      width: min(560px, 92vw);
      padding: 28px 26px;
      border-radius: 20px;
      background: #3e63dd;
      text-align: center;
      color: #e5e7eb;
    }

    .loading-card h2 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .loading-card p {
      margin: 0 0 10px;
      font-size: 0.98rem;
      line-height: 1.55;
      color: #f8fafc;
    }

    .loading-card small {
      display: block;
      font-size: 0.84rem;
      line-height: 1.45;
      color: #f8fafc;
    }

    .loading-spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 16px;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: #f8fafc;
      animation: urbane-spin 0.9s linear infinite;
    }

    @keyframes urbane-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="map-shell">
    <canvas></canvas>

    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-card">
        <div class="loading-spinner"></div>
        <h2 id="loading-title">Loading Example</h2>
        <p id="loading-text">Initializing spatial database...</p>
        <small id="loading-note">
          Loading a GeoJSON dataset into the in-browser database and rendering it on the map.
        </small>
      </div>
    </div>
  </div>

  <script type="module" src="/examples/dist/ex2.js"></script>
</body>
</html>
